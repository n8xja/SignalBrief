name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t signal-brief .
      - name: Smoke test
        run: |
          docker run --rm signal-brief --help
          # Without settings it must fail cleanly with a helpful message
          out=$(docker run --rm signal-brief https://example.com/a --dry-run 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Missing setting ANTHROPIC_API_KEY"
          # Must not run as root
          test "$(docker run --rm --entrypoint id signal-brief -u)" != "0"
